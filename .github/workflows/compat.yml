name: compat

# Bounded Node/OS compatibility matrix. Network-dependent real-package tests
# stay out of this matrix; only `npm test` (local fixtures) and a local
# `file:` fixture CLI smoke test run here.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Local fixture CLI smoke test
        run: |
          result="$(node bin/modsym.js "file:test/fixtures/fixture-barrel" gadget)"
          node -e 'const r = JSON.parse(process.argv[1]); if (r.status !== "resolved" || r.declaration?.file !== "leaf.d.ts") { throw new Error(`unexpected result: ${JSON.stringify(r)}`); }' "$result"

  os-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ["20", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Local fixture CLI smoke test
        shell: bash
        run: |
          result="$(node bin/modsym.js "file:test/fixtures/fixture-barrel" gadget)"
          node -e 'const r = JSON.parse(process.argv[1]); if (r.status !== "resolved" || r.declaration?.file !== "leaf.d.ts") { throw new Error(`unexpected result: ${JSON.stringify(r)}`); }' "$result"

  # Informational only: the declared engines minimum (Node 18) against the
  # current lockfile, whose pacote/npm-package-arg majors require newer Node.
  # Allowed to fail without blocking; see README support matrix.
  node18-informational:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
