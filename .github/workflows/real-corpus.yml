name: real-corpus

# Pinned real-package regression corpus. Network-dependent by design:
# scheduled + manual only, never a gate on ordinary pull requests.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  real-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:real
